name: Winter 2026 Task 1 - Race condition report

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/winter-2026-task1-race-condition.yml'
      - 'scripts/task_winter_2026_race_condition.py'
      - 'scripts/task_winter_2026_race_report.sh'
      - 'scripts/build_pdf_report.py'
      - 'scripts/text_to_png.py'

jobs:
  build-report-winter-2026-task1:
    runs-on: ubuntu-latest
    env:
      REPORT_AUTHOR: Миленькова Ивана
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil

      - name: Generate PDF report
        run: bash scripts/task_winter_2026_race_report.sh

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: winter-2026-task1-race-condition-report-pdf
          path: reports/winter-2026-task1/report.pdf
