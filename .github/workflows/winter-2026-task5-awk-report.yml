name: Winter 2026 Task 5 - awk report

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/winter-2026-task5-awk-report.yml'
      - 'scripts/task_winter_2026_awk_report.sh'
      - 'scripts/build_pdf_report.py'
      - 'scripts/text_to_png.py'

jobs:
  build-report:
    runs-on: ubuntu-latest
    env:
      REPORT_AUTHOR: Миленькова Ивана
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gawk python3-pil
      - run: bash scripts/task_winter_2026_awk_report.sh
      - uses: actions/upload-artifact@v4
        with:
          name: winter-2026-task5-awk-report-pdf
          path: reports/winter-2026-task5/report.pdf
