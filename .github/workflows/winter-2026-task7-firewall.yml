name: Winter 2026 Task 7 - iptables firewall report

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/winter-2026-task7-firewall.yml'
      - 'scripts/task_winter_2026_firewall_report.sh'
      - 'scripts/task_winter_2026_netns_lib.sh'
      - 'scripts/build_pdf_report.py'
      - 'scripts/text_to_png.py'

jobs:
  build-report:
    runs-on: ubuntu-latest
    env:
      REPORT_AUTHOR: Миленькова Ивана
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iptables iproute2 iputils-ping openssh-server netcat-openbsd curl openssl python3-pil
      - run: bash scripts/task_winter_2026_firewall_report.sh
      - uses: actions/upload-artifact@v4
        with:
          name: winter-2026-task7-firewall-report-pdf
          path: reports/winter-2026-task7/report.pdf
