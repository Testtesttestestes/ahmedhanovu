name: Winter 2026 Task 9 - mdadm RAID 1 and RAID 5 report

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/winter-2026-task9-raid.yml'
      - 'scripts/task_winter_2026_raid_report.sh'
      - 'scripts/build_pdf_report.py'
      - 'scripts/text_to_png.py'

jobs:
  build-report:
    runs-on: ubuntu-latest
    env:
      REPORT_AUTHOR: Миленькова Ивана
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y mdadm fonts-dejavu-core python3-pil
      - run: bash scripts/task_winter_2026_raid_report.sh
      - uses: actions/upload-artifact@v4
        with:
          name: winter-2026-task9-raid-report-pdf
          path: reports/winter-2026-task9/report.pdf
